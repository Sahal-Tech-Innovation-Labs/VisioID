version: "3.9"

services:
  backend:
    build:
      context: ./BACKEND
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./BACKEND:/app
    environment:
      - PYTHONUNBUFFERED=1
      - GROQ_API_KEY=${GROQ_API_KEY}
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend/cartscan
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/cartscan:/app
    depends_on:
      - backend
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: npm run dev
